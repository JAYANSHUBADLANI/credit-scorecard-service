# Every tunable value for the scorecard, the service and the monitoring layer lives here.
# Changing a threshold or a window length is a config edit, not a code edit.

data:
  raw_path: "data/raw/application_train.csv"
  id_column: "SK_ID_CURR"
  target_column: "TARGET"

split:
  # application_train.csv carries no application date, so there is no true time index.
  # SK_ID_CURR is used as a documented proxy for application sequence: the file is sorted
  # by it, and the later ids stand in for later applications. This is a stated assumption,
  # not a verified origination date. See README, "What is simulated and what is real".
  order_by: "SK_ID_CURR"
  train_fraction: 0.70

features:
  numeric:
    - EXT_SOURCE_1
    - EXT_SOURCE_2
    - EXT_SOURCE_3
    # AGE_YEARS was removed after the adverse action audit. Age may be used in an empirically
    # derived, demonstrably sound scoring system, but not to assign a negative factor to
    # applicants aged 62 or over, and the fitted card did exactly that: points fell
    # monotonically across all 17 age bins, 42.46 at 25 and under against 36.00 above 63.54,
    # so no applicant of 62 or more could reach the best age points at all. Cost of removing
    # it, measured rather than assumed: 0.0001 of holdout AUC.
    - EMPLOYED_YEARS
    - ID_PUBLISH_YEARS
    - PHONE_CHANGE_YEARS
    - AMT_INCOME_TOTAL
    - AMT_CREDIT
    - AMT_ANNUITY
    - REGION_POPULATION_RELATIVE
    - CREDIT_INCOME_RATIO
    - ANNUITY_INCOME_RATIO
    - CREDIT_TERM
    - GOODS_CREDIT_RATIO
  # CODE_GENDER is deliberately absent, and so is NAME_FAMILY_STATUS. Gender and marital
  # status are both prohibited bases under ECOA and Regulation B, and a card that allocates
  # points on either could not be signed off however well it discriminated. Neither is in the
  # request contract, so a later refit cannot quietly pick one up again. Measured cost:
  # 0.0014 of holdout AUC for gender, 0.0002 for marital status. Neither trade is close.
  # See README, "Characteristics deliberately excluded".
  categorical:
    - NAME_EDUCATION_TYPE
    - NAME_INCOME_TYPE
    - NAME_CONTRACT_TYPE

binning:
  max_prebins: 20
  min_bin_fraction: 0.03
  min_bin_bads: 5
  enforce_monotonic: true
  min_categorical_fraction: 0.01

selection:
  min_iv: 0.02
  max_correlation: 0.75

scaling:
  base_score: 600.0
  base_odds: 50.0
  pdo: 20.0

# Bands are specified as percentiles of the training score distribution. Training resolves
# them to absolute score cutoffs and persists those, so the served API applies fixed
# numbers rather than recomputing quantiles per request.
bands:
  decline_below_percentile: 10.0
  refer_below_percentile: 30.0

monitoring:
  window_size: 2000          # scored requests per monitoring window
  min_window_size: 500       # below this a window is skipped rather than scored on noise
  psi_warn: 0.10             # conventional scorecard thresholds, see docs/business_case.md
  psi_alert: 0.25
  csi_warn: 0.10
  csi_alert: 0.25
  prediction_psi_warn: 0.10
  prediction_psi_alert: 0.25
  reference_bins: 10         # deciles of the training distribution for prediction drift
  debounce_windows: 3        # consecutive breaching windows required before an alert fires
  cooldown_windows: 5        # windows to wait before the same metric can fire again

stream:
  total_requests: 40000
  requests_per_batch: 200
  # The first `stable_fraction` of the stream samples the held out slice as it stands.
  # After that an explicitly documented shift is applied to the sampling weights: the same
  # real held out records, drawn in a deliberately different mix. No feature value is ever
  # fabricated. See README.
  stable_fraction: 0.4
  # Strength was calibrated, not guessed. On a 2000 request window this peaks at a score PSI
  # of roughly 0.5 and an approval rate falling from about 70 percent to about 39 percent:
  # severe, and the sort of shift a risk function would want to hear about, but not absurd.
  # A strength of 3.0 was tried first and produced a PSI above 2.0, which is not a drift
  # scenario, it is a broken feed.
  drift_strength: 1.5
  # Fraction of the drifted regime spent ramping up before the shift holds at full strength.
  # Onset then plateau, rather than a ramp that only peaks at the very last request, because
  # a real channel change persists once it happens, and a sustained breach is what the
  # debounce rule is written for.
  drift_ramp_fraction: 0.3
  drift_features:
    - EXT_SOURCE_2
    - EXT_SOURCE_3
    - AGE_YEARS
  seed: 20240815

service:
  db_path: "data/monitoring.db"
  model_path: "models/scorecard.joblib"
  reference_path: "models/reference.json"

# Regulation B requires that a declined applicant is told the principal reasons. These settings
# decide what "principal" means on this card. See src/reasons.py for why each one matters.
adverse_action:
  # max_observed: the reference is the best attainable bin of the characteristic.
  # population_mean: the reference is the training population's average points for it.
  #
  # Changed from max_observed on measurement rather than preference. Under max_observed, 1,417
  # of 36,040 reasons named a characteristic the applicant sat at or above the population
  # average on, putting at least one such reason on 15.3% of notices: a factor that did nothing
  # to distinguish them from the approved population, cited as a principal reason for their
  # decline. Under population_mean that is impossible by construction. It rewrote 98.7% of
  # notices, which is why it needed the number behind it. See src/reasons.py.
  basis: "population_mean"
  # Regulation B's commentary treats disclosure of more than four reasons as unhelpful to the
  # applicant rather than more transparent.
  max_reasons: 4
  # A shortfall below this is rounding, not a reason. Points are reported to two decimals.
  min_shortfall_points: 0.05
  # Bands that constitute an adverse action. `refer` is not one: it is a referral to manual
  # underwriting, and no decision has been made yet to give reasons for.
  adverse_bands:
    - decline
  # What to do when the *served* card allocates points on a prohibited basis. `warn` serves and
  # reports it on stderr; `raise` refuses to boot. Default is warn, matching the contract check:
  # by then the card is already deployed and scoring, and an outage is the wrong answer to a
  # modelling decision.
  on_prohibited_basis: "warn"
  # The same question asked at fit time, which is where it belongs and where it is free, because
  # nothing has been built on the card yet. `raise` refuses to produce the artifact at all.
  # Set to `warn` only to fit one deliberately and measure what it costs.
  on_prohibited_basis_at_fit: "raise"
